<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera — USB Phone</title><style>body{font-family:system-ui;background:#101318;color:#f7f7f5;max-width:720px;margin:auto;padding:24px}video{width:100%;border-radius:18px;background:#000}button{padding:13px 18px;margin:8px 4px;border:0;border-radius:12px;font-weight:700}#start{background:#f7f7f5}#stop{background:#333;color:#fff}.status{margin:12px 0;padding:12px;border-radius:12px;background:#1b2028}</style></head>
<body><h1>USB Work Camera</h1><div class="status" id="status">Connecting to PC…</div><video id="preview" autoplay playsinline muted></video><div><button id="start">Allow Camera + Mic & Start</button><button id="stop" disabled>Stop Sharing</button></div>
<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);const status=document.getElementById("status"),video=document.getElementById("preview");let stream,rec;
ws.onopen=()=>{ws.send(JSON.stringify({type:"usb",role:"phone"}));status.textContent="Connected. Tap Start to share camera + mic to the PC.";};ws.onclose=()=>status.textContent="Disconnected from PC.";
document.getElementById("start").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});video.srcObject=stream;const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")?"video/webm;codecs=vp8,opus":"video/webm";rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000});ws.send(JSON.stringify({type:"meta",mime}));rec.ondataavailable=e=>{if(e.data.size&&ws.readyState===1)e.data.arrayBuffer().then(b=>ws.send(b));};rec.start(500);status.textContent="LIVE — camera + microphone are being shared to this PC.";start.disabled=true;stop.disabled=false;}catch(e){status.textContent="Permission/error: "+e.message;}};
document.getElementById("stop").onclick=()=>{if(rec)rec.stop();if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null;status.textContent="Sharing stopped.";start.disabled=false;stop.disabled=true;};
const start=document.getElementById("start"),stop=document.getElementById("stop");
</script></body></html>
