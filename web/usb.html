<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera — Phone</title>
<style>body{font-family:system-ui;background:#101318;color:#f7f7f5;max-width:720px;margin:auto;padding:24px}video{width:100%;border-radius:18px;background:#000}.box{padding:18px;border-radius:16px;background:#1b2028;margin:14px 0}.code{font-size:42px;font-weight:800;letter-spacing:8px;text-align:center}button{padding:13px 18px;margin:8px 4px;border:0;border-radius:12px;font-weight:700}#start{background:#f7f7f5}#stop{background:#333;color:#fff}</style></head>
<body><h1>Phone Camera</h1><div class="box">Your connection code<div class="code" id="code">------</div><p id="status">Connecting…</p></div>
<video id="preview" autoplay playsinline muted></video><button id="start" disabled>Allow Camera + Mic & Start</button><button id="stop" disabled>Stop</button>
<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host),status=document.getElementById("status"),code=document.getElementById("code"),video=document.getElementById("preview");let stream,rec;
ws.onopen=()=>ws.send(JSON.stringify({type:"usb",role:"phone"}));
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="usb-code"){code.textContent=m.code;status.textContent="Give this code to the PC.";start.disabled=false;}if(m.type==="usb-ready"){status.textContent="PC connected. Tap Start.";start.disabled=false;}};ws.onclose=()=>status.textContent="Disconnected.";
start.onclick=async()=>{try{ws.send(JSON.stringify({type:"usb",role:"pair",code:code.textContent}));stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});video.srcObject=stream;const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")?"video/webm;codecs=vp8,opus":"video/webm";ws.send(JSON.stringify({type:"usb",role:"meta",mime}));rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000});rec.ondataavailable=e=>{if(e.data.size&&ws.readyState===1)e.data.arrayBuffer().then(b=>ws.send(b));};rec.start(500);status.textContent="LIVE — sharing camera + microphone.";start.disabled=true;stop.disabled=false;}catch(e){status.textContent="Error: "+e.message;}};
stop.onclick=()=>{if(rec)rec.stop();if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null;status.textContent="Sharing stopped.";start.disabled=false;stop.disabled=true;};
const start=document.getElementById("start"),stop=document.getElementById("stop");
</script></body></html>
