<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera — Phone</title>
<style>body{font-family:system-ui;background:#101318;color:#f7f7f5;max-width:720px;margin:auto;padding:24px}video{width:100%;border-radius:18px;background:#000}.box{padding:18px;border-radius:16px;background:#1b2028;margin:14px 0}.code{font-size:42px;font-weight:800;letter-spacing:8px;text-align:center}button{padding:13px 18px;margin:8px 4px;border:0;border-radius:12px;font-weight:700}#start{background:#f7f7f5}#stop{background:#333;color:#fff}</style></head>
<body><h1>Phone Camera</h1><div class="box">Your connection code<div class="code" id="code">------</div><p id="status">Connecting…</p></div>
<video id="preview" autoplay playsinline muted></video><button id="start" disabled>Allow Camera + Mic & Start</button><button id="stop" disabled>Stop</button>
<script>
const status=document.getElementById("status");
const code=document.getElementById("code");
const video=document.getElementById("preview");
const start=document.getElementById("start");
const stop=document.getElementById("stop");
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
let stream=null,rec=null,starting=false;

ws.onopen=()=>ws.send(JSON.stringify({type:"usb",role:"phone"}));
ws.onmessage=e=>{
  if(typeof e.data!=="string") return;
  const m=JSON.parse(e.data);
  if(m.type==="usb-code"){
    code.textContent=m.code;
    status.textContent="Give this code to the PC.";
    start.disabled=false;
  }
  if(m.type==="usb-ready"&&!starting&&!stream){
    status.textContent="PC connected. Requesting camera + microphone permission…";
    startSharing();
  }
  if(m.type==="usb-error") status.textContent=m.message;
};
ws.onclose=()=>{status.textContent="Disconnected from server.";stopSharing(false);};

async function startSharing(){
  if(starting||stream)return;
  starting=true;
  start.disabled=true;
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API unavailable. Use Chrome on Android.");
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"user"},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24,max:30}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    video.srcObject=stream;
    await video.play().catch(()=>{});

    const candidates=[
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp8",
      "video/webm"
    ];
    const mime=candidates.find(x=>MediaRecorder.isTypeSupported(x));
    if(!mime) throw new Error("This browser cannot encode WebM video.");

    // Pair BEFORE sending media metadata/chunks so the server knows this phone's room.
    ws.send(JSON.stringify({type:"usb",role:"pair",code:code.textContent}));
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1400000,audioBitsPerSecond:96000});
    ws.send(JSON.stringify({type:"usb",role:"meta",mime}));
    rec.ondataavailable=async e=>{
      if(e.data.size&&ws.readyState===WebSocket.OPEN){
        try{ws.send(await e.data.arrayBuffer());}catch{}
      }
    };
    rec.onerror=e=>{status.textContent="Recorder error: "+(e.error?.message||"unknown");};
    rec.onstop=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;};
    rec.start(700);

    status.textContent="LIVE — camera + microphone sharing.";
    stop.disabled=false;
  }catch(e){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    video.srcObject=null;
    status.textContent="Permission/camera error: "+e.message;
    start.disabled=false;
  }finally{
    starting=false;
  }
}

function stopSharing(notify=true){
  if(rec&&rec.state!=="inactive")rec.stop();
  rec=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  if(notify&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"usb",role:"stop"}));
  status.textContent="Sharing stopped.";
  start.disabled=false;
  stop.disabled=true;
}
start.onclick=startSharing;
stop.onclick=()=>stopSharing(true);
</script></body></html>
