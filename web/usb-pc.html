<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera — PC Dashboard</title>
<style>
body{font-family:system-ui;background:#0b0d10;color:#f7f7f5;max-width:920px;margin:auto;padding:28px}
.card{background:#151a21;border:1px solid #252c36;padding:22px;border-radius:20px;margin:16px 0}
h1{font-size:34px;margin-bottom:4px}.muted{color:#9da7b3}
input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #303946;background:#0e1217;color:#fff;font-size:16px;margin-top:10px}
button{background:#f7f7f5;color:#0b0d10;font-weight:800;cursor:pointer}
.status{padding:12px;border-radius:12px;background:#0e1217;margin-top:12px}
</style></head>
<body>
<h1>Work Camera</h1><p class="muted">Send a video URL from this PC to the connected phone.</p>

<div class="card">
<h2>1. Connect Phone</h2>
<input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit phone code">
<button id="connect">Connect Phone</button>
<div id="status" class="status">Waiting for connection…</div>
</div>

<div class="card">
<h2>2. Play Video on Phone</h2>
<p class="muted">Paste a direct HTTP/HTTPS video URL. MP4 and WebM links work best.</p>
<input id="url" type="url" placeholder="https://example.com/video.mp4">
<button id="send">▶ Play on Phone</button>
<div id="sent" class="status">No video sent yet.</div>
</div>

<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
const code=document.getElementById("code"),url=document.getElementById("url"),connect=document.getElementById("connect"),sendBtn=document.getElementById("send"),status=document.getElementById("status"),sent=document.getElementById("sent");
let connected=false;

ws.onopen=()=>status.textContent="Server connected. Enter the phone code.";
ws.onclose=()=>{connected=false;status.textContent="Server disconnected.";};

connect.onclick=()=>{
  const c=code.value.trim();
  if(!/^\d{6}$/.test(c)){status.textContent="Enter the 6-digit code.";return;}
  ws.send(JSON.stringify({type:"usb",role:"pc",code:c}));
  status.textContent="Connecting to phone…";
};

ws.onmessage=e=>{
  if(typeof e.data!=="string")return;
  const m=JSON.parse(e.data);
  if(m.type==="usb-error"){connected=false;status.textContent=m.message;return;}
  if(m.type==="usb-ready"){connected=true;status.textContent="✓ Phone connected. You can send a video.";sendBtn.disabled=false;}
  if(m.type==="video-sent")sent.textContent="✓ Video sent to phone.";
};

sendBtn.disabled=true;
sendBtn.onclick=()=>{
  const u=url.value.trim();
  if(!/^https?:\/\//i.test(u)){sent.textContent="Enter a valid video URL.";return;}
  if(!connected){sent.textContent="Connect the phone first.";return;}
  ws.send(JSON.stringify({type:"usb",role:"video",code:code.value.trim(),url:u}));
  sent.textContent="Sending video to phone…";
};
</script>
</body></html>
