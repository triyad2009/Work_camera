<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera — PC Receiver</title><style>body{font-family:system-ui;background:#101318;color:#f7f7f5;max-width:1000px;margin:auto;padding:24px}video{width:100%;max-height:75vh;border-radius:18px;background:#000}.status{margin:12px 0;padding:12px;border-radius:12px;background:#1b2028}</style></head>
<body><h1>USB Work Camera — PC</h1><div class="status" id="status">Connecting…</div><video id="remote" autoplay playsinline controls></video>
<script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host),v=document.getElementById("remote"),s=document.getElementById("status");let ms,sb,q=[],mime;
ws.onopen=()=>{ws.send(JSON.stringify({type:"usb",role:"pc"}));s.textContent="Connected. Start sharing from the phone.";};ws.onclose=()=>s.textContent="Disconnected.";
function init(m){mime=m||"video/webm;codecs=vp8,opus";ms=new MediaSource();v.src=URL.createObjectURL(ms);ms.addEventListener("sourceopen",()=>{try{sb=ms.addSourceBuffer(mime);sb.mode="sequence";sb.addEventListener("updateend",pump);pump();}catch(e){s.textContent="Browser cannot play stream: "+e.message;}});}
function pump(){if(!sb||sb.updating||!q.length)return;try{sb.appendBuffer(q.shift());}catch(e){s.textContent="Playback buffer error: "+e.message;}}
ws.onmessage=async e=>{if(typeof e.data==="string"){const m=JSON.parse(e.data);if(m.type==="meta"){mime=m.mime;init(mime);s.textContent="LIVE — phone camera + mic received over USB.";}}else{const b=await e.data.arrayBuffer();if(!ms)init();q.push(b);pump();}};
</script></body></html>
