<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="/manifest.json"><title>Work Camera</title><style>body{font-family:system-ui;background:#0d0f12;color:#fff;margin:0}main{max-width:760px;margin:auto;padding:22px}.card{background:#171a1f;border:1px solid #2b3038;border-radius:20px;padding:20px}video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:14px}button{padding:13px 17px;border:0;border-radius:12px;margin:8px 5px 0 0;font-weight:700}#stop{background:#7f1d1d;color:white}</style></head><body><main><div class="card"><h1>Work Camera</h1><p>Camera sharing starts only after you grant permission and press <b>Start Sharing</b>.</p><video id="v" autoplay muted playsinline></video><p id="s">Connecting…</p><button id="start">Allow & Start Sharing</button><button id="stop" disabled>Stop Sharing</button><p>Your browser/Android camera indicator remains visible while sharing.</p></div></main><script>const room=location.pathname.split("/").pop(),v=document.getElementById("v"),s=document.getElementById("s"),start=document.getElementById("start"),stop=document.getElementById("stop");let ws,pc,stream;const send=m=>ws?.send(JSON.stringify(m));function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ws.onopen=()=>{send({type:"join",room,role:"member"});s.textContent="Connected. Waiting for dashboard…"};ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==="answer"){await pc.setRemoteDescription(m.answer)}if(m.type==="ice"&&pc)try{await pc.addIceCandidate(m.candidate)}catch{}if(m.type==="peer-left")s.textContent="Dashboard disconnected."}}async function go(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.onicecandidate=e=>e.candidate&&send({type:"ice",candidate:e.candidate});stream.getTracks().forEach(t=>pc.addTrack(t,stream));await pc.setLocalDescription(await pc.createOffer());send({type:"offer",offer:pc.localDescription});send({type:"presence",state:"sharing"});start.disabled=true;stop.disabled=false;s.textContent="Camera sharing is active."}catch(e){s.textContent="Camera permission/error: "+e.message}}function halt(){stream?.getTracks().forEach(t=>t.stop());pc?.close();stream=null;v.srcObject=null;send({type:"stop"});start.disabled=false;stop.disabled=true;s.textContent="Sharing stopped."}start.onclick=go;stop.onclick=halt;connect();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script></body></html>
