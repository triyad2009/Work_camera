<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera Dashboard</title><style>body{font-family:system-ui;background:#0b0d10;color:white;margin:0}main{max-width:1100px;margin:auto;padding:22px}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;object-fit:contain}.card{background:#15181d;border:1px solid #282d35;border-radius:20px;padding:20px}</style></head><body><main><h1>Work Camera</h1><div class="card"><video id="v" autoplay playsinline></video><p id="s">Connecting…</p></div></main><script>const room=location.pathname.split("/").pop(),v=document.getElementById("v"),s=document.getElementById("s");let ws,pc,pendingIce=[];const send=m=>ws?.readyState===WebSocket.OPEN&&ws.send(JSON.stringify(m));function makePeer(){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.ontrack=e=>{if(e.streams[0])v.srcObject=e.streams[0]};pc.onicecandidate=e=>e.candidate&&send({type:"ice",candidate:e.candidate});pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected")s.textContent="Camera is live.";else if(["failed","disconnected"].includes(pc.connectionState))s.textContent="Camera connection lost."};return pc}ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ws.onopen=()=>{send({type:"join",room,role:"owner"});s.textContent="Waiting for team member…"};ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==="offer"){makePeer();await pc.setRemoteDescription(m.offer);for(const c of pendingIce)await pc.addIceCandidate(c).catch(()=>{});pendingIce=[];await pc.setLocalDescription(await pc.createAnswer());send({type:"answer",answer:pc.localDescription});s.textContent="Connecting to camera…"}if(m.type==="ice"){if(!pc)pendingIce.push(m.candidate);else if(pc.remoteDescription)await pc.addIceCandidate(m.candidate).catch(()=>{});else pendingIce.push(m.candidate)}if(m.type==="presence")s.textContent="Team member is sharing camera.";if(m.type==="stop"){v.srcObject=null;s.textContent="Sharing stopped by team member."}if(m.type==="peer-left"){v.srcObject=null;pendingIce=[];s.textContent="Team member disconnected."}};</script></body></html>
