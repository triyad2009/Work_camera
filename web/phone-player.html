<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06080b"><title>Work Camera — Phone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06080b;color:#f5f7fa;font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:24px 16px 40px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#fff,#9da7b6);color:#080a0e;display:grid;place-items:center;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.16em;color:#7e8898;text-transform:uppercase;font-weight:800}.hero h1{font-size:38px;line-height:1;letter-spacing:-.05em;margin:8px 0 10px}.muted{color:#87919f;line-height:1.55;font-size:14px}.card{background:linear-gradient(145deg,#11161e,#0b0e13);border:1px solid #222a35;border-radius:25px;padding:20px;margin-top:16px;box-shadow:0 20px 60px #0008}.codebox{text-align:center;padding:25px 12px;border-radius:20px;background:#080b10;border:1px solid #252d38;margin-top:16px}.code{font-size:42px;font-weight:900;letter-spacing:7px}.status{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:15px;color:#929cab;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#697386}.ok .dot{background:#64d890;box-shadow:0 0 15px #64d890}video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:18px;margin-top:15px}.videoStatus{font-size:13px;color:#8e98a6;margin-top:12px;text-align:center}.empty{padding:48px 15px;text-align:center;border:1px dashed #29313d;border-radius:18px;margin-top:15px;color:#737d8b}
</style></head><body><main class="wrap">
<div class="brand"><div class="logo">WC</div><div><b>Work Camera</b><div class="eyebrow">Connected phone</div></div></div>
<section class="hero"><div class="eyebrow">PHONE PLAYER</div><h1>Ready to play.</h1><p class="muted">Keep this page open. Give the code below to the PC dashboard. A video sent from the PC will appear here.</p></section>
<section class="card"><div class="eyebrow">PAIRING CODE</div><div class="codebox"><div class="code" id="code">------</div><div id="status" class="status"><span class="dot"></span><span>Connecting…</span></div></div></section>
<section class="card"><div class="eyebrow">REMOTE VIDEO</div><h2 style="margin:8px 0 0">Your video</h2><div id="empty" class="empty">Waiting for the PC to send a video…</div><video id="player" controls playsinline style="display:none"></video><div id="videoStatus" class="videoStatus"></div></section>
</main>
<script>
const code=document.getElementById("code"),status=document.getElementById("status"),player=document.getElementById("player"),empty=document.getElementById("empty"),videoStatus=document.getElementById("videoStatus");const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
function stat(t,ok=false){status.innerHTML='<span class="dot"></span><span>'+t+'</span>';status.classList.toggle("ok",ok)}
ws.onopen=()=>ws.send(JSON.stringify({type:"usb",role:"phone"}));ws.onclose=()=>stat("Disconnected from server.");ws.onmessage=e=>{if(typeof e.data!=="string")return;const m=JSON.parse(e.data);if(m.type==="usb-code"){code.textContent=m.code;stat("Give this code to the PC dashboard.");}if(m.type==="usb-ready")stat("PC connected. Waiting for video…",true);if(m.type==="usb-error")stat(m.message);if(m.type==="video"){empty.style.display="none";player.style.display="block";player.src=m.url;player.load();videoStatus.textContent="Video received. Starting playback…";player.play().catch(()=>videoStatus.textContent="Ready — tap Play if your browser blocks autoplay.");}};
</script></body></html>
