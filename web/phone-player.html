<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050608">
<title>Work Camera — Phone Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#f7f8fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% -10%,#242b38 0,#0b0e14 45%,#050608 100%);overflow:hidden}
.top{position:absolute;z-index:10;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#050608ee,transparent)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f4f5f7;color:#07090d;font-weight:950}.name{font-size:14px;font-weight:850}
.connection{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #ffffff18;background:#ffffff0a;border-radius:999px;font-size:9px;font-weight:850;letter-spacing:.12em;color:#9da6b5}.dot{width:7px;height:7px;border-radius:50%;background:#687283}.connected .dot{background:#63df91;box-shadow:0 0 12px #63df91}.connected{color:#b9f3ce}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 18px 80px}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#7f8998;font-weight:850}.title{font-size:clamp(42px,12vw,64px);line-height:.92;letter-spacing:-.065em;font-weight:950;margin:12px 0}.sub{max-width:330px;color:#8993a2;font-size:13px;line-height:1.5}
.codebox{width:min(360px,100%);margin-top:25px;padding:10px;border:1px solid #ffffff12;background:#ffffff06;border-radius:25px;box-shadow:0 20px 70px #0008}.inner{padding:22px 12px;border-radius:17px;background:#07090d;border:1px solid #ffffff0d}.code{font-variant-numeric:tabular-nums;font-size:clamp(42px,13vw,58px);font-weight:950;letter-spacing:.08em;margin-left:.08em}.status{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:7px;color:#737d8c;font-size:11px}.footer{position:absolute;z-index:2;bottom:0;left:0;right:0;text-align:center;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);color:#596270;font-size:10px}
.player{position:fixed;inset:0;z-index:20;background:#000;display:none;align-items:center;justify-content:center}.player.show{display:flex}.video{width:100%;height:100%;object-fit:contain;background:#000}.video-controls{position:absolute;z-index:21;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 16px;display:flex;justify-content:flex-end;pointer-events:none}.badge{padding:8px 11px;border-radius:999px;background:#000b;border:1px solid #fff2;color:#e8ebef;font-size:9px;font-weight:800;letter-spacing:.1em}
.tap{position:absolute;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;border:1px solid #fff3;border-radius:999px;background:#111c;color:white;font-weight:800;display:none}.tap.show{display:block}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">WC</div><div class="name">Work Camera</div></div><div class="connection" id="connection"><span class="dot"></span><span id="connectionText">CONNECTING</span></div></header>
<main class="center" id="pairScreen">
<div class="eyebrow">PHONE PLAYER</div>
<div class="title">Ready.<br>Stay connected.</div>
<div class="sub">Keep this page open. Enter this code on the PC dashboard to connect your phone.</div>
<div class="codebox"><div class="inner"><div class="eyebrow">PAIRING CODE</div><div class="code" id="code">------</div><div class="status"><span class="dot"></span><span id="statusText">Connecting to server…</span></div></div></div>
</main>
<footer class="footer">VIDEO WILL PLAY HERE • SECURE LOCAL CONNECTION</footer>
<section class="player" id="playerScreen">
<video id="video" class="video" playsinline webkit-playsinline controls preload="auto"></video>
<div class="video-controls"><div class="badge" id="videoBadge">VIDEO RECEIVED</div></div>
<button class="tap" id="tap">▶ Tap to play</button>
</section>
</div>
<script>
const code=document.getElementById("code"),connection=document.getElementById("connection"),connectionText=document.getElementById("connectionText"),statusText=document.getElementById("statusText"),pairScreen=document.getElementById("pairScreen"),playerScreen=document.getElementById("playerScreen"),video=document.getElementById("video"),tap=document.getElementById("tap"),videoBadge=document.getElementById("videoBadge");
function connectionState(text,ok){connectionText.textContent=text;connection.classList.toggle("connected",ok);statusText.textContent=ok?"PC connected • waiting for video":text}
function enterFullscreen(){try{if(playerScreen.requestFullscreen)playerScreen.requestFullscreen().catch(()=>{});else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()}catch{}}
function showPlayer(url){video.pause();video.src=url;video.load();pairScreen.style.display="none";document.querySelector(".footer").style.display="none";playerScreen.classList.add("show");videoBadge.textContent="VIDEO RECEIVED";tap.classList.remove("show");enterFullscreen();setTimeout(()=>{video.play().then(()=>{tap.classList.remove("show");videoBadge.textContent="PLAYING"}).catch(()=>{tap.classList.add("show");videoBadge.textContent="TAP PLAY"})},120)}
tap.onclick=()=>{video.play().then(()=>{tap.classList.remove("show");videoBadge.textContent="PLAYING";enterFullscreen()}).catch(()=>{})};
video.addEventListener("play",()=>videoBadge.textContent="PLAYING");video.addEventListener("pause",()=>{if(!video.ended)videoBadge.textContent="PAUSED"});video.addEventListener("ended",()=>videoBadge.textContent="ENDED");
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
ws.onopen=()=>{connectionState("CONNECTED",false);ws.send(JSON.stringify({type:"usb",role:"phone"}));statusText.textContent="Getting pairing code…"};
ws.onclose=()=>{connectionState("OFFLINE",false);statusText.textContent="Connection lost — waiting to reconnect…"};
ws.onerror=()=>{connectionState("ERROR",false);statusText.textContent="Unable to connect to server"};
ws.onmessage=e=>{if(typeof e.data!=="string")return;let m;try{m=JSON.parse(e.data)}catch{return}
if(m.type==="usb-code"){code.textContent=String(m.code).replace(/\D/g,"").slice(0,6);connectionState("WAITING",false);statusText.textContent="Enter this 6-digit code on the PC"}
if(m.type==="usb-ready"){connectionState("CONNECTED",true);statusText.textContent="PC connected • waiting for video"}
if(m.type==="video"){showPlayer(String(m.url))}
if(m.type==="usb-error"){connectionState("ERROR",false);statusText.textContent=m.message||"Connection error"}
};
</script>
</body>
</html>
