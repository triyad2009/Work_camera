<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Camera USB</title><style>body{font-family:system-ui;background:#0b0d10;color:#fff;margin:0}main{max-width:760px;margin:auto;padding:22px}.card{background:#15181d;border:1px solid #282d35;border-radius:20px;padding:20px}video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:14px}button{padding:13px 17px;border:0;border-radius:12px;margin:8px 5px 0 0;font-weight:700}#stop{background:#7f1d1d;color:#fff}</style></head><body><main><div class="card"><h1>Work Camera — USB</h1><p>Connect Android by USB, open this page on the phone, allow camera and microphone, then start sharing.</p><video id="v" autoplay muted playsinline></video><p id="s">Ready.</p><button id="start">Allow Camera + Mic</button><button id="stop" disabled>Stop</button></div></main><script>const v=document.getElementById('v'),s=document.getElementById('s'),start=document.getElementById('start'),stop=document.getElementById('stop');let stream;start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});v.srcObject=stream;s.textContent='Camera + microphone active.';start.disabled=true;stop.disabled=false}catch(e){s.textContent='Permission/error: '+e.message}};stop.onclick=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;s.textContent='Stopped.';start.disabled=false;stop.disabled=true};</script></body></html>
